services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: bufet_local
      POSTGRES_USER: bufet
      POSTGRES_PASSWORD: bufet-local-password
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bufet -d bufet_local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: local-only-secret-key-base-change-me
      DATABASE_URL: postgresql://bufet:bufet-local-password@postgres:5432/bufet_local
      CONCERTO_DASHBOARD_URL: http://localhost:8080
      CONCERTO_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:8081,http://localhost:8082,http://127.0.0.1:8080,http://127.0.0.1:8081,http://127.0.0.1:8082
      DISABLE_SSL: "1"
      PORT: 3000
      SOLID_QUEUE_IN_PUMA: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./apps/api/storage:/rails/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/bufet-media-dashboard/Dockerfile
      args:
        EXPO_PUBLIC_API_URL: http://localhost:3001
    environment:
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_local_data:
