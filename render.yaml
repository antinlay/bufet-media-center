services:
  - type: web
    name: bufet-media-api
    runtime: docker
    rootDir: apps/api
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    healthCheckPath: /up
    autoDeployTrigger: commit
    initialDeployHook: ./bin/rails db:seed
    envVars:
      - key: RAILS_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HTTP_PORT
        value: "10000"
      - key: TARGET_PORT
        value: "3000"
      - key: WEB_CONCURRENCY
        value: "0"
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: SOLID_QUEUE_SUPERVISOR_MODE
        value: async
      - key: SOLID_QUEUE_THREADS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: bufet-media-api-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: DASHBOARD_BASE_URL
        value: https://bufet-media-center.vercel.app
      - key: CONCERTO_DASHBOARD_URL
        value: https://bufet-media-center.vercel.app
      - key: CONCERTO_ALLOWED_ORIGINS
        value: https://bufet-media-center.vercel.app
      - key: PUBLIC_API_URL
        value: https://bufet-media-api.onrender.com
      - key: SUPABASE_URL
        value: https://illaavmcrawkjfnvnqfo.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_MEDIA_BUCKET
        value: media
      - key: SUPABASE_SIGNED_URL_TTL
        value: "3600"

databases:
  - name: bufet-media-api-db
    databaseName: bufet_production
    user: bufet
    region: singapore
    plan: free
